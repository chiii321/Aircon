name: Firmware checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install tested core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install 'IRremoteESP8266@2.8.6' 'DHT sensor library@1.4.6' 'Adafruit Unified Sensor@1.1.15' 'ArduinoJson@7.4.3'
      - name: Compile Wi-Fi controller firmware
        run: |
          cp firmware/stage1_hardware_test/device_credentials.example.h firmware/stage1_hardware_test/device_credentials.h
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/stage1_hardware_test
