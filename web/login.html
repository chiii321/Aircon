<!doctype html>
<html lang="en">
<head><script src="theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>INUVAIR · Sign in</title><meta property="og:title" content="INUVAIR · Room climate control"><meta property="og:description" content="A calm place to monitor your air conditioning controllers."><meta property="og:image" content="https://inuvair.tech/assets/inuvair-og-banner-v5.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://inuvair.tech/assets/inuvair-og-banner-v5.png"><link rel="icon" type="image/svg+xml" href="assets/inuvair-logo-light-v2.svg"><link rel="apple-touch-icon" href="assets/inuvair-logo.png"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-page" data-auth-mode="login">
  <header class="public-header"><a class="public-brand" href="index.html"><img class="brand-symbol" src="assets/inuvair-logo-light-v2.svg" alt=""><span class="brand-name">INUVAIR</span></a><button id="theme-toggle" class="theme-toggle" type="button" hidden>Dark mode</button></header>
  <main class="auth-main"><section class="auth-intro"><h1>Welcome back.</h1><p>A comfortable space.<br>Your day, a little easier.</p></section><section class="form-card"><h2>Sign in</h2><p>Enter your account details to continue.</p><form id="auth-form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="form-submit" type="submit">Sign in <span aria-hidden="true">→</span></button><p id="auth-status" class="form-status" role="status" aria-live="polite"></p></form><div class="form-footer">Need access? Ask your INUVAIR administrator for an invitation.</div></section></main>
  <footer class="public-footer"><span>Designed for your everyday comfort</span><span>Philippine time · UTC+8</span></footer>
  <script type="module" src="auth.js"></script>
</body>
</html>
