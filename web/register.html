<!doctype html>
<html lang="en">
<head><script src="theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>INUVAIR · Create account</title><meta property="og:title" content="INUVAIR · Room climate control"><meta property="og:description" content="A calm place to monitor your air conditioning controllers."><meta property="og:image" content="https://inuvair.tech/assets/inuvair-og-banner-v5.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://inuvair.tech/assets/inuvair-og-banner-v5.png"><link rel="icon" type="image/svg+xml" href="assets/inuvair-logo-light-v2.svg"><link rel="apple-touch-icon" href="assets/inuvair-logo.png"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-page" data-auth-mode="register">
  <header class="public-header"><a class="public-brand" href="index.html"><span class="logo-box"><img class="brand-symbol" src="assets/inuvair-logo-light-v2.svg" alt=""></span><span class="brand-name">INUVAIR</span></a><button id="theme-toggle" class="theme-toggle" type="button" hidden>Dark mode</button></header>
  <main class="auth-main"><section class="auth-intro"><h1>Make space for <em>comfort.</em></h1><p>Use your invited email address.</p></section><section class="form-card"><h2>Create an account</h2><p>We’ll send a confirmation link to your email.</p><form id="auth-form"><div class="signup-field-pair"><div><label for="first-name">First name</label><input id="first-name" name="firstName" type="text" autocomplete="given-name" maxlength="80" required></div><div><label for="last-name">Last name</label><input id="last-name" name="lastName" type="text" autocomplete="family-name" maxlength="80" required></div></div><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><div class="signup-field-pair"><div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></div><div><label for="repeat-password">Repeat password</label><input id="repeat-password" name="repeatPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password" required></div></div><button class="form-submit" type="submit" disabled>Create account <span aria-hidden="true">→</span></button><p id="auth-status" class="form-status" role="status" aria-live="polite"></p></form><div class="form-footer">Already have an account? <a href="login.html">Sign in</a></div></section></main>
  <footer class="public-footer"><span>Philippine time · UTC+8</span></footer>
  <script type="module" src="auth.js"></script>
</body>
</html>
